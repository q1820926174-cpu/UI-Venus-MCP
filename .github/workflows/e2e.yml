name: Real-platform E2E

# Real-machine testing on GitHub's free runners (open-source repos):
#   windows-real : true Windows desktop — adapter-level closed loop
#                  (charmap → UIA → semantic write → capture)
#   linux-real   : genuine X session (Xvfb) — wmctrl/xdotool/capture E2E
#   macos-real   : real macOS, permission-gated honest suite (never red
#                  just because TCC is missing — only on real breakage)
#   venus-live   : official-protocol grounding against the real endpoint
#                  (secrets-gated; skipped cleanly when not configured)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-real:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Raw bridge diagnostics (why does input.ps1 fail on runners?)
        shell: powershell
        run: |
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"x":200,"y":200}'))
          & powershell -NoProfile -ExecutionPolicy Bypass -File src/platforms/windows/scripts/input.ps1 -Mode move -ArgsJson $b64
          Write-Output "exit=$LASTEXITCODE"
          $PSVersionTable.PSVersion
      - run: node scripts/ci/windows-e2e.mjs
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-real-report
          path: |
            ci-win-report.json
            ci-win-shot.png
          if-no-files-found: ignore

  linux-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: X session + GUI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps x11-utils xdotool wmctrl imagemagick openbox
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run E2E under Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          xsetroot -solid '#20304a' || true
          openbox > /tmp/openbox.log 2>&1 &   # EWMH WM (wmctrl path)
          sleep 2
          xclock -geometry 200x200+50+50 &    # real GUI target
          sleep 2
          echo "--- diagnostics ---"
          pgrep -a openbox || cat /tmp/openbox.log || true
          pgrep -a xclock || echo "xclock NOT running"
          DISPLAY=:99 wmctrl -l || true
          node scripts/ci/linux-e2e.mjs
      - name: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-real-report
          path: |
            ci-linux-report.json
            ci-linux-shot.png
          if-no-files-found: ignore

  macos-real:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx vitest run tests/e2e/macos-real.test.ts
        env:
          RUN_MACOS_E2E: "1"

  venus-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub runner IP ranges cannot reach the reference endpoint directly;
    # CI uses the temporary trycloudflare tunnel (scripts/dev/venus-tunnel.mjs
    # on the relay host; URL published in the VENUS_TUNNEL_URL repo variable).
    # Proven green from runners on 2026-09-29 — a hard gate now.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live grounding smoke (official protocol, real endpoint)
        env:
          RUN_VENUS_LIVE: "1"
          VENUS_TUNNEL_URL: ${{ vars.VENUS_TUNNEL_URL }}
          VENUS_DIRECT_URL: ${{ secrets.VENUS_BASE_URL }}
          VENUS_API_KEY: ${{ secrets.VENUS_API_KEY }}
          VENUS_MODEL: ${{ secrets.VENUS_MODEL }}
          VENUS_ALLOW_INSECURE_HTTP: "true"
        run: |
          if [ -z "$VENUS_API_KEY" ]; then
            echo "VENUS secrets not configured — skipping live job"
            exit 0
          fi
          # prefer the runner-reachable tunnel; fall back to the direct endpoint
          if [ -n "$VENUS_TUNNEL_URL" ]; then
            export VENUS_BASE_URL="$VENUS_TUNNEL_URL/v1"
            echo "endpoint mode: TUNNEL"
          else
            export VENUS_BASE_URL="$VENUS_DIRECT_URL"
            echo "endpoint mode: DIRECT"
          fi
          npx tsx scripts/smoke-venus.ts
          npx vitest run tests/e2e/venus-live.test.ts
